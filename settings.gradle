pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  // String path: a File would call Settings.includeBuild (not a plugin build).
  final String conventionsDir =
    providers.gradleProperty('podvalGradleDir').getOrElse('../podval-gradle')
  if (file(conventionsDir).isDirectory() && file("${conventionsDir}/settings.gradle").isFile()) {
    includeBuild conventionsDir
  }
}

plugins {
  id 'org.podval.conventions.settings' version '0.1.0'
}

rootProject.name = 'www.podval.org'

// Composite: substitute org.podval.tools:org.podval.tools.publisher from a local
// checkout. Override with -PsitePublisherDir=. If the directory is missing,
// Gradle resolves the artifact from Maven Central (CI).
final File publisherDir = file(
  providers.gradleProperty('sitePublisherDir').getOrElse('../site-publisher')
)
if (publisherDir.isDirectory() && new File(publisherDir, 'settings.gradle').isFile()) {
  includeBuild(publisherDir)
}
